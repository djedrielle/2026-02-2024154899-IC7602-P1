# Fragmento de ejemplo para integrar en el docker-compose.yml general del proyecto.
# Se muestran DOS instancias en ubicaciones distintas, que es el mínimo
# recomendado por el enunciado para que el tipo de registro "round-trip"
# tenga sentido (necesita varios Health Checkers geográficamente distintos).

services:
  health-checker-cr:
    build: ./health-checker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      CHECKER_ID: checker-cr
      CHECKER_LAT: "9.8489"
      CHECKER_LON: "-83.9091"
      CHECKER_COUNTRY: CR
      CHECKER_CITY: Cartago
      POLL_INTERVAL_SECONDS: "30"
      WORKER_THREADS: "8"
    restart: unless-stopped

  health-checker-us:
    build: ./health-checker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      CHECKER_ID: checker-us
      CHECKER_LAT: "37.7749"
      CHECKER_LON: "-122.4194"
      CHECKER_COUNTRY: US
      CHECKER_CITY: "San Francisco"
      POLL_INTERVAL_SECONDS: "30"
      WORKER_THREADS: "8"
    restart: unless-stopped
