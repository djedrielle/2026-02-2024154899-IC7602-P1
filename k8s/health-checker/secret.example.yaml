# Plantilla: NO poner valores reales aquí (este archivo se commitea).
# El Secret real se genera localmente en k8s/health-checker/secret.yaml (ignorado por git).
# Es la misma base de Supabase que usa dns-api, en formato URI de libpq (no JDBC):
#   kubectl create secret generic health-checker-secret -n dns \
#     --from-literal=DATABASE_URL='postgresql://<user>:<password>@<host>:5432/postgres?sslmode=require' \
#     --dry-run=client -o yaml > k8s/health-checker/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: health-checker-secret
  namespace: dns
  labels:
    app: health-checker
type: Opaque
stringData:
  DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/postgres?sslmode=require"
