# Plantilla: NO poner valores reales aquí (este archivo se commitea).
# El Secret real se genera localmente en k8s/dns-api/secret.yaml (ignorado por git):
#   kubectl create secret generic dns-api-secret -n dns \
#     --from-literal=SUPABASE_DB_URL='jdbc:postgresql://<host>:5432/postgres?sslmode=require' \
#     --from-literal=SUPABASE_DB_USER='postgres.<project_ref>' \
#     --from-literal=SUPABASE_DB_PASSWORD='<password>' \
#     --from-literal=SSL_KEYSTORE_PASSWORD="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml > k8s/dns-api/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dns-api-secret
  namespace: dns
  labels:
    app: dns-api
type: Opaque
stringData:
  SUPABASE_DB_URL: "jdbc:postgresql://<host>:5432/postgres?sslmode=require"
  SUPABASE_DB_USER: "postgres.<project_ref>"
  SUPABASE_DB_PASSWORD: "<password>"
  # Contraseña del keystore TLS autofirmado que genera el contenedor al arrancar
  SSL_KEYSTORE_PASSWORD: "<cadena-aleatoria>"
