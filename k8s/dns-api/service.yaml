apiVersion: v1
kind: Service
metadata:
  name: dns-api
  namespace: dns
  labels:
    app: dns-api
spec:
  # LoadBalancer en Docker Desktop publica el servicio en localhost:8080 (HTTP) y localhost:8443 (HTTPS).
  type: LoadBalancer
  selector:
    app: dns-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
