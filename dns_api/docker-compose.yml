services:
  dns-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DNS_REMOTE_IP: ${DNS_REMOTE_IP:-8.8.8.8}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    env_file:
      - .env
    restart: unless-stopped