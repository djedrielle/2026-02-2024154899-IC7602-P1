server:
  port: ${SERVER_PORT:8080}

dns:
  remote:
    host: ${DNS_REMOTE_HOST:8.8.8.8}
    port: ${DNS_REMOTE_PORT:53}
    timeout-ms: ${DNS_REMOTE_TIMEOUT_MS:5000}
  executor:
    core-size: ${DNS_EXECUTOR_CORE_SIZE:16}
    max-size: ${DNS_EXECUTOR_MAX_SIZE:64}
    queue-capacity: ${DNS_EXECUTOR_QUEUE_CAPACITY:200}

spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.tec.dnsapi: DEBUG