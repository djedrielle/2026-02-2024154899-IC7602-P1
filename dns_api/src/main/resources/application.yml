server:
  port: ${SERVER_PORT:8080}

dns:
  remote:
    host: ${DNS_REMOTE_HOST:8.8.8.8}
    port: ${DNS_REMOTE_PORT:53}
    timeout-ms: ${DNS_REMOTE_TIMEOUT_MS:5000}

spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

logging:
  level:
    root: INFO
    com.tec.dnsapi: DEBUG
